# =============================================================================
# DesigXner.com — Content Strategy Plan
# =============================================================================
# 118 articles across 11 topical clusters.
# Audience: Small-to-medium businesses in Tier-1 countries
#           (US, Canada, UK, Australia, NZ, Germany, France)
# Strategy: Topical authority via pillar+cluster model, with manufactured
#           authority via teardowns, frameworks, surveys, tools, and reports.
# Cadence: 1-2 pillars/week first 3 weeks, then 3-4 cluster pieces/week.
# =============================================================================

meta:
  site: DesigXner.com
  audience: "SMBs in Tier-1 countries"
  total_articles: 118
  cadence_target_per_week: 4
  authority_plays:
    - teardowns                  # audit + publish findings on N public SMB sites
    - named_frameworks           # own terms like "7-Second Trust Test"
    - free_tools                 # calculators, audit widgets, brief generators
    - mini_surveys               # 20-30 respondent polls baked into stats
    - annual_state_of_report     # flagship: "State of SMB Web Design 2026"
    - public_datasets            # release teardown data as downloadable CSV
    - original_glossary          # define terms with your interpretation
    - downloadable_templates     # RFPs, briefs, launch checklists
    - comparison_matrices        # cited verbatim by AI engines
    - open_source_tools          # small GitHub utilities linking back

# -----------------------------------------------------------------------------
# Cluster definitions
# -----------------------------------------------------------------------------
